name: Maintenance alerts

on:
  workflow_run:
    workflows: [Command Code catalog sync, Latest host compatibility]
    types: [completed]

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: commandcode-maintenance-alerts
  cancel-in-progress: false

jobs:
  alert:
    if: >-
      github.repository == 'patlux/pi-commandcode-provider' &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (github.event.workflow_run.event == 'schedule' || github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Always load trusted default-branch code, never the triggering run's ref/artifacts.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/github-script@v7
        with:
          script: |
            const { maintainAlert } = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/maintenance-alert.mjs`)
            core.info(await maintainAlert({ github, context }))
